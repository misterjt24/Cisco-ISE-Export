---
- name: Query Networks from ISE
  hosts: ise_server
  gather_facts: false
  vars:
    target_network_device_group: "net#net#offen"
    line_separator: "\n"
  # collections:
  #   - cisco.ise

  # ansible-playbook -i ise/network_device.yml --ask-vault-pass
  # oder
  # ansible-playbook -i ise/network_device.yml --vault-password-file ~/.ansible_vault_pass.txt
  #
  # ansible-vault edit group_vars/ise/vault.yml
  tasks:
    # - name: Show network names
    #   debug:
    #     msg: "gathered facts: {{ ansible_facts }}"

    # - name: Show network names
    #   debug:
    #     msg: "{{ result }}"

    - name: Get network device by id
      cisco.ise.network_device_info:
        ise_hostname: "{{ise_hostname}}"
        ise_username: "{{ise_username}}"
        ise_password: "{{ise_password}}"
        ise_verify: "{{ise_verify}}"
        ise_debug: "{{ise_debug}}"
        ise_uses_api_gateway: "{{ise_uses_api_gateway}}"
        ise_uses_csrf_token: "{{ise_uses_csrf_token}}"
        # id: "167eaa00-7dd2-11f1-83ed-ea77f33c0095"

      register: networks_raw

    - name: Show network names
      debug:
        msg: "{{ networks_raw | default([]) }}"

    - name: Extract network device ids
      set_fact:
        network_device_ids: >-
          {{
            networks_raw.ise_response | default([])
            | map(attribute='id')
            | list
          }}
      when: networks_raw is mapping and networks_raw.ise_response is defined

    - name: Show matching network device ids
      debug:
        msg: "{{ network_device_ids | default([]) }}"

    - name: Query each network device by id
      cisco.ise.network_device_info:
        ise_hostname: "{{ise_hostname}}"
        ise_username: "{{ise_username}}"
        ise_password: "{{ise_password}}"
        ise_verify: "{{ise_verify}}"
        ise_debug: "{{ise_debug}}"
        ise_uses_api_gateway: "{{ise_uses_api_gateway}}"
        ise_uses_csrf_token: "{{ise_uses_csrf_token}}"
        id: "{{ item }}"
      loop: "{{ network_device_ids | default([]) }}"
      register: per_id_results

    # - name: Show per-id results
    #   debug:
    #     msg:
    #       id: "{{ item.item }}"
    #       description: "{{ (item.ise_response | default([]) | first | default({})).description | default('') }}"
    #       network_device_ip_list: >-
    #         {{
    #           ((item.ise_response | default([]) | first | default({})).NetworkDeviceIPList
    #           | default((item.ise_response | default([]) | first | default({})).networkDeviceIPList
    #           | default((item.ise_response | default([]) | first | default({})).network_device_ip_list
    #           | default((item.ise_response | default({})).NetworkDeviceIPList
    #           | default((item.ise_response | default({})).networkDeviceIPList
    #           | default((item.ise_response | default({})).network_device_ip_list
    #           | default([])))))))
    #         }}
    #       raw_response: "{{ item.ise_response | default([]) }}"
    #   loop: "{{ per_id_results.results | default([]) }}"

    - name: Build per-device IP address lists
      set_fact:
        per_device_ini_contents: >-
          {{ per_device_ini_contents | default([]) + [
            {
              'addresses': (
                item.ise_response.NetworkDeviceIPList
                | default([])
                | map(attribute='ipaddress') | list
              )
            }
          ] }}
      loop: "{{ per_id_results.results | default([]) }}"
      when: target_network_device_group in item.ise_response.NetworkDeviceGroupList | default([])

    - name: Show network per_device_ini_contents
      debug:
        msg: "{{ per_device_ini_contents | default([]) }}"

    - name: Write all matching IP addresses to one file
      copy:
        dest: "{{ playbook_dir }}/network_devices.ini"
        content: >-
          {{
            per_device_ini_contents | default([])
            | map(attribute='addresses')
            | flatten
            | join(line_separator)
          }}
      delegate_to: localhost

  # - name: Show network names
  #   debug:
  #     msg: "{{ networks_raw }}"
  # #     # msg: "{{ networks_raw | json_query('current[].fvNetwork.attributes.name') }}"
